server:
  address: 192.168.5.45
  port: 8080

spring:
  application:
    name: inpatient-companio-backend
  datasource:
    url: jdbc:mysql://localhost:3306/inpatient_companio?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # Local development secret. Replace with an environment variable before production deployment.
    secret: inpatient-companio-local-dev-secret-change-before-production-2026
    access-token-minutes: 120
    refresh-token-days: 7
